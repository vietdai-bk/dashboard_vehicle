services:
  - type: web
    name: vehicle-dashboard
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt && (cd frontend && npm install && npm run build || true)
    startCommand: python server.py
    envVars:
      - key: DATA_SOURCE
        value: mock
      - key: AUTH_ENABLED
        value: "false"
